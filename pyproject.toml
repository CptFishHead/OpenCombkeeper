[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencombkeeper"
version = "0.3.1"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
opencombkeeper = "opencombkeeper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
